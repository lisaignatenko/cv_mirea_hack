services:
  cv:
    build:
      context: ./cv
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      MIGRATIONS_STATE_DIR: /var/run/migrations
      FRONTEND_HEALTH_URL: http://cv:8000/ping
      CV_HEALTH_URL: http://cv:8000/ping
      CV_WORKFLOW_URL: http://cv:8000/do_something
      CV_SEGMENT_URL: http://cv:8000/segment
      FRONTEND_SEGMENT_URL: http://cv:8000/segment
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - migrations_state:/var/run/migrations
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrations:
    build:
      context: ./back
      dockerfile: Dockerfile
    command: ["python", "-m", "back.data.migrations"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      MIGRATIONS_STATE_DIR: /var/run/migrations
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - migrations_state:/var/run/migrations
    restart: "no"

volumes:
  db_data:
  migrations_state:
