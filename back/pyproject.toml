[project]
name = "back"
version = "0.1.0"
description = "FastAPI DDD-style backend service"
readme = "README.md"
authors = [
    { name = "FRIZFOREVER", email = "kirillhromov@mail.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.1.19",
    "httpx>=0.27.0",
]

[dependency-groups]
test = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=back --cov-report=term-missing"

[project.scripts]
back = "back.main:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"
